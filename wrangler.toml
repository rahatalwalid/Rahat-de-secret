# Name must match the existing Worker in your Cloudflare dashboard.
name = "rahatdesecret"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "rahat-desecret-db"
database_id = "ffebadf3-910e-4eac-8af7-ee1725668259"

# Workers AI binding (free daily allocation; fails closed above it on the Free plan).
[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"

# Only non-secret, non-dashboard-tuned values live here (wrangler deploys overwrite dashboard variables).
[vars]
FREE_ONLY = "true"
